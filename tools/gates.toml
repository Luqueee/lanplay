# What every harness in this project proves, and what it needs to prove it.
#
# This exists because the expensive question is not running a gate, it is knowing
# which ones can run right now. Answering that by reading eighteen shell scripts and
# reasoning about each one's prerequisites - every time a machine is switched off or a
# radio degrades - was the largest single cost to working unattended. Stated as data it
# is one read.
#
# `requires` is physical and its vocabulary is deliberately small:
#
#   windows-host      the lab PC answers over ssh
#   nvidia-nvenc      that PC's encoder, so a GPU has to be present and idle enough
#   virtual-display   the IDD-LAB driver loaded and its monitor active
#   lab-source        present-source drawing on it, because Desktop Duplication only
#                     hands over a frame while something changes
#   radio             traffic has to cross the air between two machines; sending to
#                     this machine's own address does not, the kernel short-circuits it
#   mac-display       an unoccluded window on a 120 Hz panel, so the display link runs
#   mac-h264-decode   VideoToolbox on this Mac answers yes for H.264 in hardware, without
#                     which a video run measures software decode and reports it as though
#                     it were the pipeline. This was a unit assertion once, which made it
#                     a claim about whatever machine happened to run the test suite; here
#                     it is a claim about the machine a gate is about to run on, and a
#                     machine nobody asked reads as unknown rather than as a failure
#   audio-endpoint    an active render endpoint on the host
#   audio-output      an output device on the Mac, and something audible comes out
#   quiet-machine     three cores this machine is not already using, for a harness whose
#                     subject is a cadence. Derived rather than chosen: one core for the
#                     paced producer, one for whatever it is measured against, one for
#                     everything else. Read from the one-minute load average, so it is a
#                     prediction and the harness that needs it still takes its own
#                     evidence from the run - a machine that goes busy between the
#                     listing and the run is caught there rather than here
#   human-attention   a person has to hold a window in the foreground, keep their
#                     hands off a mouse, or say whether it felt right
#
# `negative_control` names the arm that MUST fail. A gate whose failure mode has never
# been observed is a gate nobody has any reason to trust; two false passes in this
# project came from the one harness that lacked one. `none yet` is honest and is a
# debt, not a property.
#
# `minutes` is wall clock for the default invocation, so an agent can plan rather than
# discover.

[meta]
schema = 1
# Kept beside the harnesses rather than in docs/ so that adding a gate and forgetting
# to describe it shows up in the same diff.
docs = "docs/testing.md"
# The scripts in tools/ that are not harnesses: machinery the gates run on, and
# machinery that runs on what the gates produced. Stated here so that adding a
# script forces the question - gate or plumbing? - to be answered in the same
# diff, and so that the test which checks this index against the directory
# needs no list of its own.
plumbing = [
    # Turns a red CI run into something readable without a token: it prints what
    # cargo said as annotations, which the public API serves and the run log does
    # not. It measures nothing and decides nothing, keeping cargo's exit code.
    "tools/ci-annotate.sh",
    "tools/link-arm.sh",
    "tools/link-pacer.sh",
    "tools/win-session.sh",
    "tools/win-ssh.sh",
    "tools/win-sync.sh",
    # Release machinery: these read the results a harness left behind rather
    # than measuring anything, so they have nothing to require and no negative
    # control to owe.
    "tools/check-evidence.sh",
    "tools/collect-evidence.sh",
    "tools/pin-actions.sh",
]

# ---------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------

[gates.radio-preflight]
script = "tools/radio-preflight.sh"
proves = "whether this link will hold still for the length of a run, so that what the run then measures is about the system and not about the weather"
phase = "A0"
requires = []
minutes = 2
negative_control = "A6's own first two minutes, results/audio/e2e-corrected/radio-trace-first-120s.csv, replayed through the same reader: the one window in this repository everybody agrees was contaminated, and the run this gate exists to have stopped. It refuses at -4.305 dB/min, which projects -43.05 dB over a 600 s run against a 3 dB budget, and on a half-median step of -6.0 dB against a population inside +-1.5. The harness requires that the refusal names the deciding criterion rather than merely happening, because a control that refuses on an unreadable file certifies nothing. Rejected: a band tightened below the measured scatter, which tests the arithmetic against itself; and a scan run underneath the sampler, which depends on the radio's mood on the day and would have this gate reach for the very instrument that once produced the bunching an experiment went looking for"
notes = "requires nothing because nothing crosses the air: it reads the association through CoreWLAN, so a Mac with no association is refused with that as the reason rather than filtered out of a listing. The verdict is two-valued - a link outside the band is REFUSED and exits 2, never 1, because a radio that moves is the absence of a condition and not a defect in the pipeline. It therefore does not go through xtask verdict, whose Fail is unconditional and correct: a precondition is not a criterion. The band is one measured number, 3 dB, the spread of median signal across A8's thirteen arms over which their median rate ran 288 to 576 Mbps; `tools/radio-preflight.sh --band` recomputes the whole derivation from the nineteen committed windows. Level is recorded and never judged, since no measurement here says which level works, and a DFS channel is recorded and carried rather than refused - ten unbroken minutes of channel 100 showed no hold, and refusing it would invent a threshold"

[gates.audio-gate]
script = "tools/audio-gate.sh"
proves = "WASAPI loopback delivers a known format and cadence with every frame accounted for by device position"
phase = "A1"
requires = ["windows-host", "audio-endpoint"]
minutes = 2
negative_control = "the silent-endpoint arm: the endpoint held open by a render stream of zeros, which delivers its whole cadence and no audio, so the samples are the only thing that can catch it. Measured, 1001 packets and 480480 frames of 480000 nominal over ten seconds, no position gap, no discontinuity in flight, 0 silent packets and the probe exiting 0 - the criteria firing are the tone frequencies and the channel distinctness, over a full population. Stopping the tone was tried first and refused as the control: an idle endpoint delivers 0 packets and 0 frames, which is the report a capture started in session 0 gives and the report a probe that never started gives, and an arm that produces nothing certifies whatever it was pointed at"
notes = "the tone carries a different frequency per channel so channel order and content are provable, which a frame count cannot do. WASAPI leaves the silent flag clear on a buffer full of zeros, since the flag is the engine declaring its buffer undefined rather than a statement about content, so the silent-packet count cannot stand in for the tone detector"

[gates.codec-gate]
script = "tools/codec-gate.sh"
proves = "Opus round-trips the tone with the sample count exact, and what a 5 ms frame costs against a 10 ms one"
phase = "A2"
requires = []
minutes = 1
negative_control = "the exchanged arm: the 5 ms arm with the two contract tones swapped before the encoder, which the two criteria naming a frequency per channel must refuse. The exchange is the smallest perturbation that reaches a criterion - same spectrum, same level, same frame count - so the other four checks hold and the arm is evidence about those two rather than about a path that broke. Rejected: a frame duration Opus does not permit, refused by the probe before a document exists; a truncated packet, which makes the arm emit nothing; a mono decoder against a stereo encoder, which fires the sample-count criterion but aliases 997 Hz onto 1994 Hz, inside the right channel's tolerance of 1997"
notes = "runs entirely on the Mac; libopus vendors C so nothing here cross-checks for Windows"

[gates.audio-rtp-gate]
script = "tools/audio-rtp-gate.sh"
proves = "one Opus frame is one datagram and the RTP timestamp counts samples exactly"
phase = "A3"
requires = []
optional_requires = ["windows-host", "radio"]
minutes = 1
negative_control = "the control arm: the same loopback path relayed through udp-fault at seed 20250815, which must produce loss, duplicates and reordering, and which is judged against the loopback arm's own criteria rather than a threshold of its own. Measured at ten seconds: 51 missing, 24 duplicated and 18 reordered of 1967 that arrived, against a loopback arm of 2000 with none of the three. Wired with one probe first, sending from the socket it received on, which udp-fault reads as the reply direction: 2000 of 2000 lost and the control passed on the harness being broken rather than on the criteria firing, which is why what it received is now held against what the loopback arm received"
notes = "each end of each arm writes a JSON envelope and `xtask verdict` decides it; nothing here parses the probe prose. Which criteria an arm states follows from the arm it is told it is, because a receive-only run cannot tell a fault relay on 127.0.0.1 from a peer across the air. The radio arm needs a second endpoint and declares itself unavailable rather than sending to this machine's own address, which the kernel puts on loopback, and its loss figure comes out of the receiving end sequence accounting rather than out of differencing the two ends: one run sent 2000 and the far end saw 1740 with no sequence gap at all, a contiguous head that left before its socket was listening"

[gates.jitter-gate]
script = "tools/jitter-gate.sh"
proves = "the jitter buffer conceals rather than stalling and never grows past its ceiling under loss, a stall and churn"
phase = "A4"
requires = []
minutes = 7
negative_control = "the loss arm: it must show concealment happening, and a loss arm with nothing concealed fails rather than passes"
notes = "the ceiling cannot be exercised by a delay - only a sink slower than its source can breach it, which is A7"

[gates.render-gate]
script = "tools/render-gate.sh"
proves = "a ring buffer feeds CoreAudio for five minutes with nothing unfilled, nothing overwritten and nothing missing"
phase = "A5"
requires = ["audio-output"]
minutes = 6
negative_control = "the producer at default priority: it underran ten times in three hundred seconds, and that arrangement is what the promoted one has to beat"
notes = "five minutes because a twenty second run called the broken arrangement clean two times out of three"

[gates.audio-e2e-gate]
script = "tools/audio-e2e-gate.sh"
proves = "Windows loopback to Opus to RTP to the jitter buffer to CoreAudio delivers the source unconcealed, and the device unstarved, over a minute and over ten"
phase = "A6"
requires = ["windows-host", "radio", "audio-endpoint", "audio-output"]
minutes = 15
negative_control = "the broken-link arm: udp-fault holds every datagram for 400 ms every 2 s, forty times the jitter target, so what arrives is past its moment and the concealer stands in for a fifth of the source. The arm must fail, and the gate fails if it passes. Note what it does not do: the render underrun count stays at zero throughout, which is the whole reason the two are separate criteria"
notes = "two criteria and not one. Source concealment is samples expected against played, with a gap credited because the source's own audio sits either side of it and an empty buffer refused because nothing of the source was there; playout continuity is render_underruns over a positive population of render_callbacks. Forty of the forty envelopes committed under results/audio report zero render underruns, so the device has never been handed silence here and a concealment figure quoted without it invites its reader to hear a starved device. A run whose underruns are zero because the concealer ran throughout carried nothing, which is why frames_played is insisted on beside both. The sender runs in the interactive session through win-session.sh since session 0 has no audio endpoints, and it is built on the host because libopus needs the cmake inside BuildTools. Refuses rather than reports when the host, the radio, the endpoint, the output device or an envelope is missing"

[gates.jitter-target-sweep]
script = "tools/jitter-target-sweep.sh"
proves = "which jitter target this path should pay: the smallest of 5, 10, 15 and 20 ms that conceals none of the source, or that none of them does"
phase = "A8"
requires = ["windows-host", "radio", "audio-endpoint", "audio-output"]
minutes = 40
negative_control = "the control arm: the largest target in the sweep, 20 ms, behind udp-fault holding every datagram for 400 ms every 2 s at seed 20250815 - twenty times that target, so no candidate here could have held it. It runs first and aborts the sweep rather than being discovered forty minutes later, because a deciding counter that cannot come out negative makes every ranking above it worthless. It has to fail by the right amount as well as fail: a fifth of the stream is held, A6's identical arm lost 21.0 per cent of its samples, and an arm losing less than 10 per cent is refused as a fault that never reached the path rather than counted as a control. Rejected: a target of zero, which the receiver accepts silently and the buffer then quantises up to one frame - measured, --target-ms 0 and --target-ms 1 both report target ms 5 over a 25 ms ceiling, identical to --target-ms 5 - so it is a fourth copy of the smallest candidate arm and would hold every criterion on any link where 5 ms holds them"
notes = "the deciding counter is A6's, source concealment of samples expected against played, because a run whose underruns are zero because the concealer ran throughout carried nothing. Playout continuity is a separate criterion here, render_underruns over a positive population of render_callbacks, refused per arm rather than assumed, and printed beside every concealment ratio the ranking quotes. Each target is measured three times over 120 s, the passes ordered 5-10-15-20 then exactly reversed so a monotone drift cancels between them and then in a third order, and the arms at the incumbent 10 ms are the instrument's own noise floor. Refuses rather than ranks when one target's own arms come out both ways, when a smaller target conceals nothing where a larger one did not, when a pass's measured margins do not rise with its nominal targets - the anchor draw, and measured at 28.05 ms of margin on a 5 ms arm against 20.50 on a 20 ms one - when the incumbent's arms disagree on that margin by the whole 5 ms step, or when the arms' mean PHY rates differ by more than a factor of two or their mean signal by more than 8 dB. A sweep where every target held or none did is decided without any of that, since neither outcome needs one arm compared with another. VERDICT_ONLY=1 with OUT set re-decides a recorded sweep, which is how the arithmetic is exercised without spending the radio"

[gates.jitter-excess]
script = "tools/jitter-excess.sh"
proves = "what every candidate jitter target would have cost on one population, as a survival curve of target-independent excess delay out to 100 ms, plus the cluster structure a survival curve cannot express"
phase = "A8.1"
requires = ["windows-host", "radio", "audio-endpoint", "audio-output"]
minutes = 16
negative_control = "the control arm: the same path relayed through udp-fault holding 5 per cent of the datagrams for 40 ms at seed 20250815, so the injected distribution is a point mass at a known position and reproducible. What it has to demonstrate is that the curve SEES it - a curve that cannot see a population deliberately put in front of it is a curve whose clean arm says nothing, and no synthetic assertion about the arithmetic tests that, since it would pass equally on an instrument reading its own scratch buffer. Four criteria, three on the control and one on the clean arm, and the fourth is what keeps the first three from being satisfied by an instrument that reports 5 per cent past 30 ms on every run it ever sees: the fraction past 30 ms within a factor of two of the injected 5, a cliff between 30 and 60 ms rather than a tail, p95 landing on the 40 ms hold, and the clean arm's fraction past 30 ms at least ten times smaller. Measured over loopback at that seed: 5.036 per cent past 30 ms, 403 frames past 30 and 0 past 60, p95 at 37.53 ms, against a clean arm with 0 past 5 ms and a maximum excess of 0.10 ms. It runs first and aborts before the ten-minute arm rather than being discovered after it, on one number read straight out of its document. Rejected: A6's and A8's stall of 400 ms every 2 s, which breaks concealment comprehensively and says nothing about resolution, because every held datagram lands in one enormous bin and what this gate has to prove about itself is that it can place a distribution."
notes = "the deciding counter is neither concealment nor underruns. Playout continuity is zero in 40 of 40 committed envelopes, so the device has never been handed silence and cannot rank anything; source concealment is a consequence of the target the run happened to be configured with, and this gate's whole point is that the target is derived rather than configured. So the run is refused when render_underruns is non-zero over a positive render_callbacks population, the concealment ratio is reported beside the curve as a consequence, and what is measured is excess delay referred to the run's own minimum. Three decisions inside the primitive are not the harness's: the reference is the minimum over the run and not the first packet, since a first packet that landed badly shifts the whole distribution by a constant and did so by 25 ms between two arms of one link; the drift is fitted from the run and removed with the uncorrected curve beside it, because A7's 9.29 ppm is 5.6 ms over 600 s and the targets are 5 ms apart; and the fit runs through one minimum per 10 s block rather than through every arrival, because a burst destroys ordinary least squares - measured over loopback with the true drift zero, an injected 5 per cent held 40 ms read -6.92 ppm all-points against +0.07 ppm through the minima. The run length is derived and not chosen: 30 clusters is where a rate's fractional standard error reaches 18 per cent, the correlated unit is the cluster and never the frame, and at the two per thousand of frames this link put past 20 ms that is 300 s, so 600 s is that with a factor of two in hand and is the arm A6 already held. The consequence is stated rather than hidden: no run this gate can take will quote a cluster rate at 100 ms, so a rate is withheld with its count named wherever the run saw fewer than 30 clusters. The curve reaches 100 ms because its shape says whether this is one heavy distribution or a normal regime with a second class of stall, and reporting a figure at 30, 50 or 80 ms authorises nothing: targets above 20 ms are a product decision taken elsewhere. Refuses on any lost packet, any off-grid timestamp, any timeline hole where the sequence numbers report no loss, a trace that overflowed, a timeline position claimed twice, a run shorter than 600 s, fewer blocks than its own length implies, and a curve that rises. Every one of those is exercised by `SELFTEST=1 tools/jitter-excess.sh`, which builds a document to trip each and requires it to fire, and requires the unmutated document to pass so the suite cannot be satisfied by a function that refuses everything. It asks the radio preflight for channel 36 at 80 MHz and for the projection as well, unlike the sweep: one run has no counterbalancing to fall back on, so a link that moves inside the run moves inside the population the curve is computed over"

