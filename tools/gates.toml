# Video
# ---------------------------------------------------------------------------

[gates.e2e-gate]
script = "tools/e2e-gate.sh"
proves = "capture to NVENC to RTP to VideoToolbox to Metal, with delivery and presentation accounted separately"
phase = "video"
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 2
negative_control = "the fixture parameter set: a decoder configured from anything but the encoder's own parameter sets rejects real slices, so that arm must fail"
notes = "REQUIRE_CLEAN_DISPLAY=0 makes it a link experiment and its presentation figures then mean nothing; LINK_ONLY=1 drops the renderer entirely"

[gates.phase-sign]
script = "tools/phase-sign.sh"
proves = "which way a known shift moves the phase between a source's frame and the viewer's refresh"
phase = "video"
requires = ["windows-host", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 2
negative_control = "a run where the shift never reached the producer: the step is absent and the gate refuses instead of reading the drift as a direction"
notes = "finds the step in the series rather than comparing the ends of a run, because the drift sweeps a period every few hundred seconds"

[gates.phase-lottery]
script = "tools/phase-lottery.sh"
proves = "whether the presentation phase is drawn afresh per session or is one free-running clock"
phase = "video"
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 8
negative_control = "not applicable: both outcomes are answers, and the harness reports which rather than passing or failing"
notes = "needs several sessions and refuses a run too short to sample the phase"

[gates.wifi-matrix]
script = "tools/wifi-matrix.sh"
proves = "whether the link or the pipeline is what limits cadence, for one sender configuration"
phase = "video"
requires = ["windows-host", "radio", "mac-h264-decode"]
minutes = 20
negative_control = "none yet"
notes = "the name promises more than the script does: it takes one label, duration, fps and pacer per invocation and cannot change the radio's channel or width, so a ranking is something a person assembles from several runs. Described as ranking channels until an audio tail was diagnosed and this was reached for as the instrument that would settle it"

[gates.bitrate-sweep]
script = "tools/bitrate-sweep.sh"
proves = "where bitrate starts costing delivery rather than quality"
phase = "video"
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 25
negative_control = "none yet"

[gates.mtu-sweep]
script = "tools/mtu-sweep.sh"
proves = "the datagram size the link carries best"
phase = "video"
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 20
negative_control = "none yet"

[gates.qos-sweep]
script = "tools/qos-sweep.sh"
proves = "whether a service class changes anything this radio does"
phase = "video"
requires = ["windows-host", "radio", "mac-h264-decode"]
minutes = 15
negative_control = "none yet"

[gates.start-gate]
script = "tools/start-gate.sh"
proves = "the session reaches first picture within its budget from cold"
phase = "video"
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 3
negative_control = "none yet"

[gates.latency-gate]
script = "tools/latency-gate.sh"
proves = "the software latency of the loop by segment, each interval local to one machine"
phase = "I10"
requires = ["windows-host", "virtual-display", "mac-display"]
minutes = 3
negative_control = "a run where the injector took the foreground: every timed event lands in the background and the gate fails on that count rather than reporting a finding about SendInput"
notes = "the launch order decides whether the measurement means anything; the injector must be up before the target takes the foreground"

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------

[gates.input-gate]
script = "tools/input-gate.sh"
proves = "a generator's motion or keys reach the host exactly, compared against what it injected"
phase = "I1 I2 I3"
requires = ["windows-host"]
minutes = 2
human_attention = "the keyboard arm needs a text window in the foreground on the host; a device touched during a run makes the generator comparison unavailable rather than failed"
negative_control = "a dry run: the injector counts without calling SendInput, so the host-side injection count must be zero"

[gates.input-capture-gate]
script = "tools/input-capture-gate.sh"
proves = "nothing leaks across a capture boundary and nothing is left held"
phase = "I9"
requires = ["windows-host"]
minutes = 2
negative_control = "none yet, though the barrier is checked in both directions: events before it refused and events after it accepted"
notes = "synthetic by default; REMOTE=1 injects for real"

[gates.input-safety-gate]
script = "tools/input-safety-gate.sh"
proves = "the whole input set survives a link that misbehaves, and a client that vanishes releases everything"
phase = "I5 I6 I7"
requires = []
optional_requires = ["windows-host"]
minutes = 2
negative_control = "the killed arm: a client that vanishes mid-stream must still leave nothing held, and it is checked apart from the graceful arm rather than summed with it"
notes = "the one harness here that had two arms from the start, and the only one that never produced a false pass"

[gates.input-fault-sweep]
script = "tools/input-fault-sweep.sh"
proves = "reliable input survives loss, duplication, reordering and stalls across eight seeded arms"
phase = "I7"
requires = []
minutes = 4
negative_control = "each arm is its own control: an arm that reports nothing abandoned and nothing held while the injector dropped datagrams is a pass that has to be explained"

[gates.game-input-test]
script = "tools/game-input-test.sh"
proves = "a real game receives the input, and whether it feels right"
phase = "I8"
requires = ["windows-host", "human-attention"]
minutes = 2
negative_control = "not applicable"
notes = "the only harness whose most important result is not a number; a person plays and says"

# ---------------------------------------------------------------------------
# Control plane
# ---------------------------------------------------------------------------

[gates.cadence-isolation]
script = "tools/cadence-isolation-gate.sh"
proves = "a control connection wedged until its writes time out costs a 120 Hz producer nothing it can spend"
phase = "video"
requires = ["quiet-machine"]
minutes = 1
negative_control = "the contended arm: the same wedge, the same timeout and the same filler sent from the producer's own thread rather than from a thread of its own, which is the arrangement this design rejected and which must break the bound the isolated arm holds"
notes = "this was a unit test until a three-core runner failed it, which made it a claim about whichever machine ran the suite; the arms are still tests and still in the transport crate, ignored so that `cargo test -- --ignored` runs exactly them, and a run whose quiet half could not hold 120 Hz is refused here rather than failed there"

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

[gates.monitor-neutrality]
script = "tools/monitor-neutrality-gate.sh"
proves = "that the passive monitor does not perturb the session it watches, and - first - that this comparison could tell if it did"
phase = "N1"
# The full video path, because presented-frame cadence is one of the compared
# quantities and it does not exist without a display link. A link-only version
# would compare three of the four and call the monitor neutral about the one
# stage it touches last.
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-display", "mac-h264-decode"]
minutes = 35
negative_control = "the expensive arm: the same sampler with its 1 Hz interval removed, reading CoreWLAN as fast as it will answer, which the same comparison MUST separate from the cheap one. This is not a control that has to fail - it is the control that decides whether the harness has any power at all, and the verdict tests it before it tests anything else: an expensive arm indistinguishable from the cheap one is REFUSED with 'no power', never PASS, because the absence of a difference between on and off then says nothing whatever. Expensive in the same currency any real cost of the monitor would be spent in - a thread inside CoreWLAN contending for the same shared client - because a control burning CPU in an empty loop would prove this comparison detects empty loops. Rejected: a control that scans, which is known to perturb this pipeline - system_profiler SPAirPortDataType turned a link delivering at 8.09 ms p50 and 11.35 ms p99 into one reading 2.04 ms p50 and 133 ms p99 - so an arm that scanned would re-test that finding instead of this one and break the no-scan assertion in the same breath. The two no-scan assertions each carry their own companion: the structural search must find the four association selectors the client does use, or its silence about scan selectors is a search looking at the wrong strings, and the observational one requires at least one 'SCAN request received' from some process across the harness window - locationd scans every few minutes here - because a log reader that sees no scan at all could not have seen the client's."
notes = "the separation rule is scale-free and has no threshold to move after the fact: separated(A,B) = |median(A)-median(B)| > max(within-arm spread of A, of B), spread being max minus min. Arms are rotated, not blocked and not merely alternated - pass k runs the list rotated left by k-1, so with three arms and three passes each arm occupies each position exactly once and a monotone drift across the harness cancels rather than becoming the effect; blocking cancels nothing and this project lost a sweep to it. Comparability is the ratio between the extreme per-arm median PHY rates against a factor of two, with signal recorded beside it and deciding nothing, because rate is the mechanism airtime works through: ten arms at -48 dBm and a median 1200 Mbps produced concealment from 0.196 to 7.442 per cent while 3 dB between them moved the negotiated rate by nothing. Intersecting per-arm p10-p90 rate intervals was rejected as degenerate - two internally flat arms never intersect however close their rates are, so it refuses exactly the cleanest links. The rate population is sampled five seconds either side of every run and never inside one, because the off arm's whole definition is that no sampler is running and characterising it with a sampler would destroy it; the figure is therefore a boundary measurement and is stated as one. A run that delivered nothing is excluded and named rather than averaged, which is also the only thing here that catches a media path a firewall dropped while e2e-gate's route check passed on tcp/22 - those are different failures. Memory comes from the report's own memory section against the client gate's own 1 MB/min, so nothing parses prose."

[gates.classify-sessions]
script = "tools/classify-sessions.sh"
proves = "that the degradation classifier labels every session whose diagnosis was written down when it was taken, and says which conditions the committed corpus cannot reach at all"
phase = "N3"
# Nothing, and that is worth stating rather than leaving as an empty list nobody
# reads. No host, no radio, no display, no audio device, no quiet machine: the
# whole population is committed under results/, so this is the one gate in this
# index that can run on a laptop on a train and the only one whose result cannot
# be spoiled by the weather. That is the point of validating N3 offline before it
# ever sees a live session - a classifier that cannot label runs already
# documented will not label a live one, and finding that out costs no hardware
# time.
requires = []
minutes = 1
negative_control = "three arms, each shown firing in the same run. The radio arm classifies one session twice, once with its wifi.csv beside it and once without, and requires the same label both times - NetworkObservation.radio is an Option because CoreWLAN may decline, and a classifier that stopped without one would make the Option a lie. The population arm doctors a session's stream.expected to 0 and requires a refusal rather than a pass, because every ratio in it becomes a zero over an absence and a zero over an absence is not a healthy run; the harness exits 2 there and 1 for a disagreement, and the two are kept apart because nothing was measured in the first case. The table arm exchanges one row's recorded verdict - ch36-r1 from Healthy to CadenceDegraded, chosen because it is a mitigated-channel row and CadenceDegraded is the condition the whole channel result is about, so the exchange reaches a criterion rather than breaking a parse - and requires the pass to fail naming that session, which is what distinguishes a check reading the corpus from one announcing its own output. Rejected: deleting a session from the corpus, which the harness already refuses on the table and the corpus naming different populations, so it tests the bookkeeping rather than the classifier"
notes = "the ground truth is a table in the script itself, one row per session with the commit it comes from, so it is diffable beside the runner and the third control can mutate it with one substitution. The population is `git ls-files results` rather than what is on disk: a peer's uncommitted scratch directory widened it by seventeen sessions once, and a validation whose population drifts is not a validation of anything stated. 21 of the 59 sessions can be turned into a middle tier; the other 38 are refused with the missing tier named, which is not a verdict about their links - 17 audio envelopes, because link-metrics is video-side and nothing in a receive envelope counts an arrival crossing against the frame grid; 18 arms whose delivery block predates the tail counters; and 3 whose host delivered under 99 per cent of its target rate, so their crossings would have measured the producer. 51 rows are checked, either against a recorded diagnosis or against that refusal; the remaining 8 carry no record and are printed unchecked, because guessing a label and then matching it is a criterion that cannot fail. Three of the six conditions are confirmed against a recorded diagnosis and the output names the debt on each of the other three every run: CapacityPressure waits on a session that ever exhibited it and may never get one from a lab that has never been throughput-limited, SevereLoss on a session recorded with a loss tier - which macos/client now emits and no committed envelope carries - and UnknownDegradation on a committed session of its shape. The general limit is stated every run too: no envelope here states what the sender produced or sent, so no loss rate is derivable from any of them and this classifier decides on cadence alone"

[gates.net-preflight]
script = "tools/net-preflight-gate.sh"
proves = "that a five-second probe of the product's own traffic reads this link as it is, reads a link it must not call good as bad, and refuses when it was presented with nothing at all - which is what makes the starting point a session picks from it a measurement rather than a default"
phase = "N2"
# The radio because the whole point is that the traffic crosses the air: sending to
# this machine's own address is short-circuited by the kernel and measures a memcpy.
# The host because the generator is `net-bench send` on the lab PC, which is where
# the fixture lives. No encoder, no virtual display, no lab source and no
# mac-display: nothing here captures, encodes, decodes or presents anything, and a
# probe that needed a window would be measuring the display link again.
requires = ["windows-host", "radio"]
minutes = 2
negative_control = "the fault arm judged by the clean arm's criteria, and the clean arm judged by the fault arm's. udp-fault relays the same traffic with 2 per cent loss and a 120 ms hold every 1500 ms at seed 20250815 - the hold rather than more loss, because a hold is bunching and bunching is the fault a stall counter exists to separate from loss. That arm passes its own criteria, which are must-not-be-zeros, and passing those is not failing anything, so it is judged a second time by the criteria the gate actually asserts - loss zero over its own population, worst complete-interval under 120 ms - and must be refused by them. The clean arm is crossed the other way and must fail to show an injected loss it never had, so neither direction is a criterion nobody has seen disagree. A third arm runs first and needs no hardware: no sender at all, which must come back REFUSED and never PASS, because zero datagrams lost out of zero sent is the most common way an instrument here has lied. Rejected: A6's own 400 ms hold every 2 s, which at 50 Mbps queues two thousand datagrams and 2.4 MB in the relay, so what reaches the far side is dominated by the relay's release burst rather than by the link; and a larger loss figure, which would destroy the population the instrument is being shown reading"
notes = "the 120 ms bound on the clean arm's worst interval is derived from the four 120 s arms committed on this channel - results/b3-channel ch36-r1, r2, r3 and ch36-return-r1, whose worst complete-intervals are 26.07, 50.59, 68.62 and 98.57 ms - and is fixed in the probe rather than passed in, because a bound chosen after an arm ran is a bound fitted to its answer. Crossing and cluster counts are deliberately not criteria at this length: those same arms cluster at 2.0 to 18.5 a minute, which is 0.17 to 1.5 clusters inside a five-second window, so a count expected to be small but non-zero separates nothing and is reported as a finding instead. The probe emits two documents from one measurement - the report, which describes and classifies nothing, and the envelope `xtask verdict` decides - and the report deliberately carries no display, decode or environment section, both because nothing was presented to anybody and because that absence is what stops `lanplay_network_health::corpus` reading a preflight as a session whose diagnosis nobody wrote down"

[gates.fps-shootout]
script = "tools/fps-shootout.sh"
proves = "which of 120, 90 and 60 fps this project may use as a mitigation for cadence degradation, and the answer is allowed to be none: it holds one absolute cadence disturbance constant across the three rates, normalises every threshold by each rate's own period, and asks whether the metrics that define the condition improve"
phase = "N4-B"
# The full video path, because the intervention is the sender choosing which of the
# virtual display's frames to transmit and the cost of choosing fewer is measured at
# presentation. The radio because the whole point is that the traffic crosses the
# air: the injected disturbance sits on this side of it and the link is under every
# arm regardless. No mac-display, because the presentation figures are the cost side
# and are reported rather than deciding, and insisting on an unoccluded window turns
# a link experiment into a fight with the window server; occlusion still reaches
# `invalidating_events` and those runs are dropped from the cost table alone.
requires = ["windows-host", "nvidia-nvenc", "virtual-display", "lab-source", "radio", "mac-h264-decode"]
minutes = 50
negative_control = "the three hold arms, and the one at 120 fps decides whether the run means anything. udp-fault holds every datagram for 60 ms every 150 ms at seed 20250815, which is the injection N2 sized against this link rather than against taste: it predicts 60000/150 = 400 threshold crossings a minute from its own period, before any arm runs, against the 162 a minute N1 measured between arms with nothing running at all. N2's earlier draft of 120 ms every 1500 would have sat inside that noise, and A6's 400 ms every 2 s stays rejected because at 50 Mbps it queues some 2000 datagrams and what arrives is the relay's release burst. The control has to fire in both of the ways that can be checked separately - it must reach three quarters of the 400 crossings its own configuration predicts, and it must completely separate from the clean arm at the same frame rate - and the run is REFUSED rather than reported if either fails, because a run where lowering the frame rate changed nothing is otherwise indistinguishable from a run where nothing could have been seen. The floor is one-sided by construction: the injection cannot produce fewer occurrences than its own rate unless something absorbed them, and more is the link adding its own. It is also the only control here that could be built: the condition cannot be waited for, since an experiment that needs the weather to misbehave reports whatever the afternoon gave it"
notes = "the deciding metrics are the ones `classify` reads - counted crossings of two source periods a minute and stall clusters a minute, each normalised by the arm's own period because the client builds its Delivery from 1000/feed_fps and link-metrics' existing THRESHOLDS then apply unchanged. The raw millisecond percentiles are printed in a separate table under a heading saying no criterion reads them, because a p99 that halves because T doubled is not an improvement and a reader must not be able to mistake one table for the other. Arms are rotated, not blocked: pass k runs the list rotated left by k-1, and with six arms and three passes each arm occupies three different positions and never the same one twice, which reduces rather than cancels a monotone drift - exact cancellation needs six passes, and the position each arm ran in is recorded per run so a reader can check the ordering did not line up with the finding. Two controls hold before anything is ranked: comparability as the ratio between the extreme per-arm median PHY rates against a factor of two, sampled at 1 Hz inside each arm because N2 watched tx_rate_mbps fall from 432 to 103 Mbps between the two boundary reads of one five-second probe; and under-production, refusing any arm whose delivered rate is more than one per cent short of its own nominal, which has already fired for real - N1's arms delivered 101 to 120 access units a second against a target of 120 with packet loss zero on seven of ten, so the air delivered everything it was given and those units were never sent. Every arm is labelled by crates/network-health rather than by eye, and the classifier is asked rather than reimplemented and without parsing a word of its output: its contract is a three-valued exit code against a table of expectations, so one probe per candidate condition names the label. The virtual display stays at 1920x1080 120 Hz from the first arm to the last and the sender picks frames with --mode paced, so a network experiment and an IddCx mode switch never land in one test; the 120 arm is uncapped because pacing at the source's own rate is a closed decision against. PASS means the experiment answered under conditions that could have answered either way, and the finding is printed on its own line and is allowed to be that FPS is not a network mitigation"
