[package]
name = "lanplay-nvenc-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lanplay-capture = { workspace = true }
lanplay-encoder-nvenc = { workspace = true }
lanplay-present-source = { workspace = true }
lanplay-protocol = { workspace = true }
lanplay-transport = { workspace = true }
lanplay-video-core = { workspace = true }
lanplay-telemetry = { workspace = true }
clap = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Added here rather than to the workspace list because only this crate reaches
# the display driver: the configuration manager to find its interface, and a
# file handle and an IOCTL to use it.
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
