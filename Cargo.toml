[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/telemetry",
    "crates/transport",
    "crates/video-core",
    "macos/client",
    "macos/decoder-videotoolbox",
    "macos/renderer-metal",
    "tools/benchmark",
    "tools/net-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
lanplay-capabilities = { path = "crates/capabilities" }
lanplay-decoder-videotoolbox = { path = "macos/decoder-videotoolbox" }
lanplay-protocol = { path = "crates/protocol" }
lanplay-renderer-metal = { path = "macos/renderer-metal" }
lanplay-telemetry = { path = "crates/telemetry" }
lanplay-transport = { path = "crates/transport" }
lanplay-video-core = { path = "crates/video-core" }
clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3"
getrandom = "0.3"
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
# objc2-core-video's own `objc2-io-surface` feature enables the crate without
# its `objc2-core-foundation` feature, so `IOSurfaceRef` never gets its CF type
# implementation and the build fails. Depending on it directly fixes the
# feature set.
objc2-io-surface = { version = "0.3.2", features = ["objc2-core-foundation"] }
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-video-toolbox = "0.3.2"

# Latency work needs symbols in release builds; the pipeline is never profiled in debug.
[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
