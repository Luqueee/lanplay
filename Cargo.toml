[workspace]
resolver = "3"
members = [
    "crates/audio-codec",
    "crates/input-protocol",
    "crates/link-metrics",
    "crates/protocol",
    "crates/telemetry",
    "crates/transport",
    "crates/video-core",
    "macos/audio-render",
    "macos/client",
    "macos/decoder-videotoolbox",
    "macos/input-capture",
    "macos/renderer-metal",
    "tools/benchmark",
    "tools/mouse-mover",
    "tools/pcap-analyse",
    "tools/udp-fault",
    "tools/radio-sample",
    "tools/capture-bench",
    "tools/net-bench",
    "tools/present-source",
    "tools/tone-source",
    "tools/nvenc-probe",
    "windows/audio-capture",
    "windows/capture",
    "windows/encoder-nvenc",
    "windows/input-inject",
    "windows/input-latency-target",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
lanplay-audio-capture = { path = "windows/audio-capture" }
lanplay-audio-codec = { path = "crates/audio-codec" }
lanplay-tone-source = { path = "tools/tone-source" }
lanplay-capabilities = { path = "crates/capabilities" }
lanplay-capture = { path = "windows/capture" }
lanplay-encoder-nvenc = { path = "windows/encoder-nvenc" }
lanplay-decoder-videotoolbox = { path = "macos/decoder-videotoolbox" }
lanplay-input-protocol = { path = "crates/input-protocol" }
lanplay-link-metrics = { path = "crates/link-metrics" }
lanplay-protocol = { path = "crates/protocol" }
lanplay-renderer-metal = { path = "macos/renderer-metal" }
lanplay-present-source = { path = "tools/present-source" }
lanplay-telemetry = { path = "crates/telemetry" }
lanplay-transport = { path = "crates/transport" }
lanplay-video-core = { path = "crates/video-core" }
clap = { version = "4", features = ["derive"] }
# libopus through its reference C implementation, vendored and built by
# `opus-head-sys`. A pure-Rust reimplementation was considered and rejected: an
# encoder that is subtly wrong produces audio that sounds nearly right and
# fails in ways nobody can see, and the reference implementation is what every
# Opus decoder in the world is tested against.
#
# A `-sys` crate with nothing above it, which is the point. The wrapper that
# used to sit there brought `audiopus_sys`, unmaintained since 2020 and flagged
# by RUSTSEC-2026-0150 for vendoring a libopus whose
# `cmake_minimum_required(VERSION 3.1)` CMake 4 refuses outright, so the build
# succeeded only where pkg-config found a system libopus instead. This one
# vendors a source that asks for 3.16. `crates/audio-codec` owns the FFI now,
# which is the crate whose job that already was.
#
# Default features off, both of them deliberately. `dnn` builds DRED and OSCE,
# recovery and enhancement features this project does not run, on the same
# grounds DTX and in-band FEC are off: they spend or withhold bytes according
# to conditions the measurements do not create. `fast-math` defines
# OPUS_FLOAT_APPROX and OPUS_FAST_MATH, which change the arithmetic inside the
# encoder whose output is the measurement.
opus-head-sys = { version = "0.3", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
crossbeam-queue = "0.3"
getrandom = "0.3"
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The gate index is TOML, and `xtask gates` reads it. `preserve_order` keeps the
# gates in the order the file states them, which groups them by subsystem;
# sorted by name they interleave audio, video and input for no reason.
toml = { version = "1", default-features = false, features = [
    "parse",
    "serde",
    "std",
    "preserve_order",
] }

block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
# objc2-core-video's own `objc2-io-surface` feature enables the crate without
# its `objc2-core-foundation` feature, so `IOSurfaceRef` never gets its CF type
# implementation and the build fails. Depending on it directly fixes the
# feature set.
objc2-io-surface = { version = "0.3.2", features = ["objc2-core-foundation"] }
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-video-toolbox = "0.3.2"

# Latency work needs symbols in release builds; the pipeline is never profiled in debug.
[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
