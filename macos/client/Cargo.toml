[package]
name = "lanplay-client"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# An AppKit application whose run loop is turned by hand, presenting through a
# Metal layer and decoding on VideoToolbox. Every one of those three is a macOS
# framework, so this is the platform half rather than a portable crate.
[package.metadata.lanplay]
platforms = ["macos"]

[[bin]]
name = "lanplay-client"
path = "src/main.rs"

[dependencies]
lanplay-decoder-videotoolbox = { workspace = true }
libc = { workspace = true }
hdrhistogram = { workspace = true }
lanplay-capabilities = { workspace = true }
lanplay-link-metrics = { workspace = true }
lanplay-protocol = { workspace = true }
lanplay-renderer-metal = { workspace = true }
lanplay-telemetry = { workspace = true }
lanplay-transport = { workspace = true }
lanplay-video-core = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
