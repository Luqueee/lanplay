[package]
name = "lanplay-audio-render"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# CoreAudio's HAL, entered through `AudioDeviceCreateIOProcID` on the default
# output device and driven by the HAL's own real-time thread. Nothing off macOS
# has that device layer, so this crate has to be named in the Windows job's
# exclusions and states here that it does.
[package.metadata.lanplay]
platforms = ["macos"]

[[bin]]
name = "audio-render-probe"
path = "src/bin/probe.rs"

[dependencies]
# `Samples` and `Percentiles` come from the capture crate rather than being
# written again here. Both are plain arithmetic, tested off Windows, and
# `Samples` is already fixed-capacity for exactly the reason this crate needs:
# it is recorded into from a callback that must not allocate.
lanplay-audio-capture = { workspace = true }
lanplay-tone-source = { workspace = true }
lanplay-telemetry = { workspace = true }
clap = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { workspace = true }
objc2-core-audio-types = { workspace = true }
objc2-core-foundation = { workspace = true }
