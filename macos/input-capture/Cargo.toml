[package]
name = "lanplay-input-capture"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# AppKit: a global event monitor for the pointer and the keyboard, and
# `NSApplication`/`NSWindow` focus notifications for when the capture must let
# go. `CGEventTap` was rejected upstream, so there is no portable arm hiding
# behind this.
[package.metadata.lanplay]
platforms = ["macos"]

[[bin]]
name = "input-capture-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "gamepad-capture-probe"
path = "src/bin/gamepad_probe.rs"

[dependencies]
clap = { workspace = true }
hdrhistogram = { workspace = true }
lanplay-input-protocol = { workspace = true }
lanplay-telemetry = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-game-controller = { workspace = true }
objc2-foundation = { workspace = true }
