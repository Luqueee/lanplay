# What CI can honestly say about this repository.
#
# It can say the code compiles for the platforms it claims and that its pure logic
# holds. It cannot say the system works: the behaviour that matters lives in an NVENC
# engine, a virtual display driver, a radio between two machines, a 120 Hz panel and
# two crystals that drift against each other, and a runner has none of those. See
# docs/ci.md for what is covered where, and docs/testing.md for the harnesses that
# cover the rest.
#
# ACTIONS ARE NOT PINNED YET. Every `uses:` below names a version tag, which resolves
# to whatever that tag points at today. Before this workflow is trusted, run
# tools/pin-actions.sh to rewrite each one to a commit SHA; `xtask actions --check`
# fails while any remain unpinned and is the mechanism rather than the intention.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull request superseded by another push has nothing to prove; a push to main is
# never cancelled, because its result is what a release later depends on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. No job here needs more, and a job that later does should raise
# it for itself rather than inheriting it from the file.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No RUSTFLAGS here on purpose. Set at workflow level it applies to every dependency as
  # well, so a warning in somebody else's crate fails this build for a reason nobody here
  # can fix. Strictness belongs on the clippy invocations, where it covers the code this
  # project owns. And `--locked` is passed explicitly rather than through an environment
  # variable, because the one that looks like it would do this does not exist.

jobs:
  # The workspace builds and tests whole on macOS, which is the only platform where
  # every member compiles: the crates under windows/ are Windows-only and the ones
  # under macos/ need AppKit.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `set +e` around the pipeline on purpose. The runner starts `shell: bash` with
      # `-eo pipefail`, so a failing cargo kills the step at the pipe and the reporter
      # below never speaks - which is exactly what happened on run 5, where the only
      # annotation was the runner's own "exit code 101" and the reason stayed unreadable.
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log
          code=${PIPESTATUS[0]}
          set -e
          tools/ci-annotate.sh /tmp/clippy.log "$code" "macos clippy"
      - name: test
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          set -e
          tools/ci-annotate.sh /tmp/test.log "$code" "macos tests"
      # The index that tells an agent which harnesses can run. Its own tests assert
      # that every harness is described and every described script exists, so this is
      # what stops the index rotting away from the scripts. And `platforms` checks the
      # windows job's exclude list against what each crate declares it supports, which
      # is the mechanism the comment below claims and did not have.
      - run: cargo run -q -p xtask --locked -- gates --debt
      - run: cargo run -q -p xtask --locked -- platforms

  # Windows carries the capture, encoder, injection and driver-facing crates. The
  # macOS-only members are excluded by name, and `xtask platforms` in the job above
  # checks this list against what each crate declares it supports. The list alone did
  # not fail loudly as its comment used to claim: a macOS-only crate missing from it
  # arrived as `cannot find wifi in lanplay_capabilities` in an unrelated-looking
  # crate, which cost a wrong diagnosis and two red runs.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: test what Windows can build
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked \
            --exclude lanplay-client \
            --exclude lanplay-decoder-videotoolbox \
            --exclude lanplay-input-capture \
            --exclude lanplay-renderer-metal \
            --exclude lanplay-audio-render \
            --exclude lanplay-mouse-mover \
            --exclude lanplay-radio-sample 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          set -e
          tools/ci-annotate.sh /tmp/test.log "$code" "windows tests"
      - name: clippy the same set
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked \
            --exclude lanplay-client \
            --exclude lanplay-decoder-videotoolbox \
            --exclude lanplay-input-capture \
            --exclude lanplay-renderer-metal \
            --exclude lanplay-audio-render \
            --exclude lanplay-mouse-mover \
            --exclude lanplay-radio-sample \
            -- -D warnings 2>&1 | tee /tmp/clippy.log
          code=${PIPESTATUS[0]}
          set -e
          tools/ci-annotate.sh /tmp/clippy.log "$code" "windows clippy"

  # rust-version in Cargo.toml is a promise, and an unenforced promise drifts within a
  # release or two. Checked rather than tested: the guarantee is that it compiles on the
  # oldest toolchain claimed, not that the test harness of that vintage behaves.
  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # Licences and advisories. Separate from the build so that a new advisory names
  # itself instead of arriving inside a compilation failure.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories sources
